[workspace]
members = [
    "boiler_core",
    "boiler_macros",
    "boiler_cli"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Mateusz Maćkowski <mateusz@mackowski.org>"]
readme = "README.md"
repository = "https://github.com/m4tx/boiler.git"
homepage = "https://github.com/m4tx/boiler"
license = "MIT"
edition = "2024"
rust-version = "1.99"

[profile.release]
codegen-units = 1
lto = true

[workspace.dependencies]
anyhow = "1.0.104"
boiler_core = { path = "boiler_core", version = "0.1" }
boiler_macros = { path = "boiler_macros", version = "0.1" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
shadow-rs = "2.0.0"
